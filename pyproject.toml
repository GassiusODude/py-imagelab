[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-image-laboratory"
version = "0.0.0"
description = "Python Image Processing/Analysis library"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "GassiusODude"}
]
dependencies = [
    "colorlog",
    "numpy",
    "opencv-python",
    "gradio<4.0",
    "dlib",
    "mediapipe" # google face detection
]

[project.urls]
Homepage = "https://github.com/GassiusODude/py-imagelab"

[tool.setuptools]
packages = ["py_imagelab"]

[tool.setuptools.package-data]
# Tells setuptools that the "py_imagelab" package contains tflite binaries
"py_imagelab" = ["models/*.tflite", "*.tflite"]

# Sphinx configuration block replacing command_options from setup.py
[tool.sphinx]
project = "python-image-laboratory"
version = "0.0.0"
release = "0.0"
sourcedir = "py_imagelab/"

# Modern Pytest replacement configuration for [nosetests]
[tool.pytest.ini_options]
verbosity = 1
addopts = """
    --tb=short
    --cov=py_imagelab
    --cov-report=term
    --pdb
"""



[tool.mypy]
# Explicitly tell mypy to expect the openCV attribute naming convention
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["dlib.*", "gradio.*", "mediapipe.*"]
ignore_missing_imports = true
